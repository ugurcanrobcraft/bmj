<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BMJ - Jubbio Bot Host</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #03050b;
            --bg-darkblue: #090e24;
            --bg-card: rgba(18, 26, 56, 0.75);
            --bg-input: rgba(10, 16, 38, 0.85);
            --neon-blue: #2563eb;
            --neon-purple: #8b5cf6;
            --glow-purple: rgba(139, 92, 246, 0.35);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(139, 92, 246, 0.25);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-black); color: var(--text-main); }
        .app-container { width: 100%; height: 100%; max-width: 440px; margin: 0 auto; background: radial-gradient(circle at top right, #15103a 0%, var(--bg-black) 80%); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .app-header { background: rgba(9, 14, 36, 0.95); backdrop-filter: blur(16px); padding: 14px; text-align: center; border-bottom: 1px solid var(--border-glow); flex-shrink: 0; z-index: 10; }
        .app-header h1 { font-size: 1.1rem; font-weight: 800; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .view-panel { flex: 1; display: none; flex-direction: column; overflow-y: auto; position: relative; padding: 16px; padding-bottom: 70px; }
        .view-panel.active { display: flex; }
        #auth-screen { justify-content: center; padding-bottom: 16px; background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15) 0%, transparent 70%); }
        .auth-card { background: var(--bg-card); backdrop-filter: blur(20px); padding: 24px 18px; border-radius: 20px; border: 1px solid var(--border-glow); }
        .auth-card h2 { text-align: center; font-size: 1.2rem; margin-bottom: 16px; }
        .input-group { margin-bottom: 12px; position: relative; }
        .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }
        .input-box { width: 100%; padding: 12px 12px 12px 40px; background: var(--bg-input); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; outline: none; user-select: text; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: 700; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; }
        .btn-purple { background: linear-gradient(135deg, #6366f1, var(--neon-purple)); }
        .btn-blue { background: linear-gradient(135deg, #1d4ed8, var(--neon-blue)); }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-sub); }
        .empty-box { margin: auto; text-align: center; color: var(--text-sub); font-size: 1rem; }
        .bot-list { display: flex; flex-direction: column; gap: 10px; }
        .bot-card { background: var(--bg-card); backdrop-filter: blur(12px); border-radius: 14px; padding: 14px; border: 1px solid var(--border-glow); border-left: 4px solid var(--neon-purple); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .fab-btn { position: fixed; bottom: 75px; right: 20px; background: linear-gradient(135deg, #6366f1, var(--neon-purple)); color: #fff; padding: 12px 20px; border-radius: 30px; font-weight: 700; box-shadow: 0 6px 20px var(--glow-purple); cursor: pointer; z-index: 10; display: flex; align-items: center; gap: 8px; }
        .glass-card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-glow); padding: 14px; border-radius: 14px; margin-bottom: 12px; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; display: flex; background: rgba(9, 14, 36, 0.98); backdrop-filter: blur(16px); border-top: 1px solid var(--border-glow); z-index: 99; }
        .nav-link { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text-sub); cursor: pointer; opacity: 0.5; flex-direction: column; gap: 2px; }
        .nav-link span { font-size: 0.65rem; }
        .nav-link.active { opacity: 1; color: var(--neon-purple); }
        .modal-bg { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3, 5, 11, 0.92); backdrop-filter: blur(10px); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
        .modal-box { background: var(--bg-darkblue); width: 100%; max-height: 90vh; display: flex; flex-direction: column; padding: 18px; border-radius: 20px; border: 1px solid var(--border-glow); }
        .code-area { width: 100%; height: 110px; background: #04060f; border: 1px solid var(--border-glow); border-radius: 12px; color: #a78bfa; font-family: 'JetBrains Mono', monospace; padding: 10px; outline: none; margin-bottom: 10px; resize: none; user-select: text; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1><i class="fa-solid fa-robot"></i> BMJ - Jubbio Bot Host</h1>
    </div>

    <!-- GİRİŞ EKRANI -->
    <div id="auth-screen" class="view-panel active">
        <div class="auth-card">
            <h2>Giriş Yap</h2>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="user-input" class="input-box" placeholder="Kullanıcı Adı">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="pass-input" class="input-box" placeholder="Şifre">
            </div>
            <button class="btn btn-purple" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
        </div>
    </div>

    <!-- ANA EKRAN (BOTLAR LİSTESİ) -->
    <div id="main-screen" class="view-panel">
        <div id="bot-list-box" class="bot-list"></div>
        <div class="fab-btn" onclick="openModal('make-modal')"><i class="fa-solid fa-plus"></i> Create Bot</div>
    </div>

    <!-- BOT DETAY & YÖNETİM SEKMELERİ -->
    <div id="detail-screen" class="view-panel">
        
        <!-- 1. BOT ANA SAYFA (Host Süresi & Host Ver & Unhost) -->
        <div id="tab-home" class="tab-sec">
            <div class="glass-card">
                <p style="font-size:0.75rem; color:var(--text-sub);">Bot İsmi</p>
                <h2 id="bot-name-txt" style="font-size:1.3rem; margin-top:2px;">-</h2>
                <p id="bot-status-txt" style="font-size:0.8rem; margin-top:6px; color:var(--danger);"><i class="fa-solid fa-circle" style="font-size:0.6rem"></i> Durum: İnaktif</p>
            </div>

            <div class="glass-card" style="border-color: var(--warning);">
                <p style="font-size:0.75rem; color:var(--text-sub);">Kalan Host Süresi</p>
                <h3 id="host-time-txt" style="font-size:1.4rem; color:var(--warning); margin: 4px 0;">24:00:00</h3>
                <button class="btn btn-warning" style="margin-top:8px;" onclick="addHostTime()"><i class="fa-solid fa-clock"></i> Host Ver (+2 Saat)</button>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <button class="btn btn-purple" style="flex:1;" onclick="deployBotToServer()"><i class="fa-solid fa-bolt"></i> Başlat</button>
                <button class="btn btn-danger" style="flex:1;" onclick="unhostBot()"><i class="fa-solid fa-power-off"></i> Unhost</button>
            </div>
        </div>

        <!-- 2. KOD OLUŞTURMA VE LİSTELEME SAYFASI -->
        <div id="tab-codes" class="tab-sec" style="display:none;">
            <button class="btn btn-blue" style="margin-bottom:12px;" onclick="openAddCodeModal()"><i class="fa-solid fa-plus"></i> Yeni Komut Ekle</button>
            <div id="code-list-box"></div>
        </div>

        <!-- 3. VARIABLE SAYFASI -->
        <div id="tab-vars" class="tab-sec" style="display:none;">
            <div class="glass-card">
                <h4 style="font-size:0.9rem; margin-bottom:8px;"><i class="fa-solid fa-database"></i> Değişken (Variable) Yönetimi</h4>
                <div class="input-group" style="margin-bottom:8px;">
                    <input type="text" id="var-name" class="input-box" style="padding-left:14px;" placeholder="Değişken Adı (Örn: para)">
                </div>
                <div class="input-group" style="margin-bottom:8px;">
                    <input type="text" id="var-val" class="input-box" style="padding-left:14px;" placeholder="Değer (Örn: 100)">
                </div>
                <button class="btn btn-purple" onclick="saveVariable()">Değişken Kaydet</button>
            </div>
            <div id="var-list-box"></div>
        </div>

        <!-- 4. YÖNETİM SAYFASI (Token Güncelle & Botu Sil) -->
        <div id="tab-settings" class="tab-sec" style="display:none;">
            <div class="glass-card">
                <h4 style="font-size:0.9rem; margin-bottom:8px;"><i class="fa-solid fa-key"></i> Token Güncelle</h4>
                <div class="input-group" style="margin-bottom:8px;">
                    <input type="text" id="update-token-input" class="input-box" style="padding-left:14px;" placeholder="Yeni Bot Token">
                </div>
                <button class="btn btn-blue" onclick="updateBotToken()">Tokeni Kaydet</button>
            </div>
            <button class="btn btn-danger" style="margin-top:12px;" onclick="deleteBot()"><i class="fa-solid fa-trash"></i> Botu Sil</button>
            <button class="btn btn-secondary" style="margin-top:12px;" onclick="exitDetail()"><i class="fa-solid fa-arrow-left"></i> Geri Dön</button>
        </div>

        <!-- ALT MENÜ -->
        <div class="bottom-nav">
            <div class="nav-link active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i><span>Ana Sayfa</span></div>
            <div class="nav-link" onclick="switchTab('codes', this)"><i class="fa-solid fa-code"></i><span>Kodlar</span></div>
            <div class="nav-link" onclick="switchTab('vars', this)"><i class="fa-solid fa-database"></i><span>Variable</span></div>
            <div class="nav-link" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i><span>Yönetim</span></div>
        </div>
    </div>

    <!-- MODAL: CREATE BOT -->
    <div id="make-modal" class="modal-bg">
        <div class="modal-box" style="max-height:auto;">
            <h3 style="margin-bottom:12px; font-size:1.1rem;">Create Bot (Jubbio)</h3>
            <div class="input-group">
                <i class="fa-solid fa-robot"></i>
                <input type="text" id="make-name" class="input-box" placeholder="Bot İsmi (Örn: Eletro Bosch)">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input type="text" id="make-token" class="input-box" placeholder="Jubbio Bot Token">
            </div>
            <button class="btn btn-purple" onclick="submitMakeBot()">Oluştur (24 Saat Host Hediyeli)</button>
            <button class="btn btn-secondary" style="margin-top:6px;" onclick="closeModal('make-modal')">İptal</button>
        </div>
    </div>

    <!-- MODAL: KOD DÜZENLE -->
    <div id="code-modal" class="modal-bg">
        <div class="modal-box">
            <h3 style="margin-bottom:8px; font-size:1rem;">Komut Editörü</h3>
            <div class="input-group" style="margin-bottom:8px;">
                <input type="text" id="code-title" class="input-box" style="padding-left:14px;" placeholder="Komut Adı (ping.js)">
            </div>
            <textarea id="code-body" class="code-area"></textarea>
            <button class="btn btn-purple" onclick="submitSaveCode()">Kaydet</button>
            <button class="btn btn-secondary" style="margin-top:6px;" onclick="closeModal('code-modal')">İptal</button>
        </div>
    </div>
</div>

<script>
    const RENDER_API_URL = window.location.origin;

    let appData = JSON.parse(localStorage.getItem('bmj_jubbio_host_db')) || { bots: [] };
    let currentBotId = null;
    let editingCodeIdx = null;

    function login() {
        if(!document.getElementById('user-input').value || !document.getElementById('pass-input').value) return alert("Bilgileri doldur!");
        document.getElementById('auth-screen').classList.remove('active');
        document.getElementById('main-screen').classList.add('active');
        renderMainScreen();
    }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function renderMainScreen() {
        const box = document.getElementById('bot-list-box');
        box.innerHTML = appData.bots.length === 0 ? `<div class="empty-box">Kayıtlı Botun Yok!</div>` : '';
        appData.bots.forEach(bot => {
            const card = document.createElement('div');
            card.className = 'bot-card';
            card.onclick = () => openBotDetail(bot.id);
            card.innerHTML = `<div><h4>${bot.name}</h4><p style="font-size:0.75rem; color:var(--text-sub);">Komut: ${bot.codes.length} | Variable: ${bot.variables.length}</p></div><i class="fa-solid fa-chevron-right" style="color:var(--text-sub)"></i>`;
            box.appendChild(card);
        });
    }

    function submitMakeBot() {
        const name = document.getElementById('make-name').value.trim();
        const token = document.getElementById('make-token').value.trim();
        if (!name || !token) return alert("İsim ve Token gir!");
        
        appData.bots.push({
            id: Date.now(),
            name,
            token,
            hostSeconds: 86400, // İlk bot yapımında 24 saat hediye (saniye cinsinden)
            isActive: false,
            codes: [{ name: 'ping.js', content: '&trigger[messageCreate]\n&sendMessage[Pong!]' }],
            variables: []
        });
        localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
        closeModal('make-modal');
        renderMainScreen();
    }

    function openBotDetail(id) {
        currentBotId = id;
        const bot = appData.bots.find(b => b.id == id);
        document.getElementById('bot-name-txt').innerText = bot.name;
        document.getElementById('update-token-input').value = bot.token;
        updateBotStatusUI(bot);
        updateHostTimeDisplay(bot);

        document.getElementById('main-screen').classList.remove('active');
        document.getElementById('detail-screen').classList.add('active');
        switchTab('home', document.querySelectorAll('.nav-link')[0]);
        renderCodes(bot);
        renderVariables(bot);
    }

    function exitDetail() {
        currentBotId = null;
        document.getElementById('detail-screen').classList.remove('active');
        document.getElementById('main-screen').classList.add('active');
        renderMainScreen();
    }

    function switchTab(k, el) {
        document.querySelectorAll('.tab-sec').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + k).style.display = 'block';
        if(el) el.classList.add('active');
    }

    function updateHostTimeDisplay(bot) {
        let hrs = Math.floor(bot.hostSeconds / 3600);
        let mins = Math.floor((bot.hostSeconds % 3600) / 60);
        let secs = bot.hostSeconds % 60;
        document.getElementById('host-time-txt').innerText = 
            String(hrs).padStart(2,'0') + ":" + String(mins).padStart(2,'0') + ":" + String(secs).padStart(2,'0');
    }

    // Her 5 dakikada 2 saat ekleme sistemi (Butona basınca veya otomatik tetiklenebilir)
    function addHostTime() {
        const bot = appData.bots.find(b => b.id == currentBotId);
        bot.hostSeconds += 7200; // 2 saat = 7200 saniye
        localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
        updateHostTimeDisplay(bot);
        alert("🎉 Host süresine 2 saat eklendi!");
    }

    function updateBotStatusUI(bot) {
        const st = document.getElementById('bot-status-txt');
        if(bot.isActive) {
            st.innerHTML = `<i class="fa-solid fa-circle" style="font-size:0.6rem; color:var(--success)"></i> Durum: Aktif (Çalışıyor)`;
            st.style.color = "var(--success)";
        } else {
            st.innerHTML = `<i class="fa-solid fa-circle" style="font-size:0.6rem; color:var(--danger)"></i> Durum: İnaktif`;
            st.style.color = "var(--danger)";
        }
    }

    async function deployBotToServer() {
        const bot = appData.bots.find(b => b.id == currentBotId);
        try {
            const res = await fetch(`${RENDER_API_URL}/api/run-bot`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ botId: bot.id, token: bot.token, codes: bot.codes })
            });
            const data = await res.json();
            if(res.ok) {
                bot.isActive = true;
                localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
                updateBotStatusUI(bot);
            }
            alert(data.message || data.error);
        } catch(err) {
            alert("Render bağlantı hatası!");
        }
    }

    async function unhostBot() {
        const bot = appData.bots.find(b => b.id == currentBotId);
        try {
            const res = await fetch(`${RENDER_API_URL}/api/stop-bot`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ botId: bot.id })
            });
            bot.isActive = false;
            localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
            updateBotStatusUI(bot);
            alert("Bot unhost edildi (durduruldu)!");
        } catch(err) {
            alert("Bağlantı hatası!");
        }
    }

    function renderCodes(bot) {
        const box = document.getElementById('code-list-box');
        box.innerHTML = '';
        bot.codes.forEach((c, i) => {
            const item = document.createElement('div');
            item.className = 'glass-card';
            item.style.cursor = 'pointer';
            item.onclick = () => { editingCodeIdx = i; document.getElementById('code-title').value = c.name; document.getElementById('code-body').value = c.content; openModal('code-modal'); };
            item.innerHTML = `<strong>${c.name}</strong>`;
            box.appendChild(item);
        });
    }

    function openAddCodeModal() {
        editingCodeIdx = null;
        document.getElementById('code-title').value = '';
        document.getElementById('code-body').value = '&trigger[messageCreate]\n&sendMessage[Test]';
        openModal('code-modal');
    }

    function submitSaveCode() {
        const title = document.getElementById('code-title').value.trim();
        const content = document.getElementById('code-body').value;
        const bot = appData.bots.find(b => b.id == currentBotId);
        if(editingCodeIdx !== null) bot.codes[editingCodeIdx] = { name: title, content };
        else bot.codes.push({ name: title, content });
        localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
        closeModal('code-modal');
        renderCodes(bot);
    }

    function renderVariables(bot) {
        const box = document.getElementById('var-list-box');
        box.innerHTML = '<h4 style="font-size:0.85rem; margin:10px 0 6px 0; color:var(--text-sub);">Kayıtlı Variable\'lar:</h4>';
        if(bot.variables.length === 0) {
            box.innerHTML += `<p style="font-size:0.75rem; color:var(--text-sub);">Henüz değişken eklenmemiş.</p>`;
            return;
        }
        bot.variables.forEach((v, idx) => {
            const item = document.createElement('div');
            item.className = 'glass-card';
            item.innerHTML = `<strong>${v.name}</strong> = ${v.val} <button class="btn btn-danger" style="padding:4px; font-size:0.7rem; margin-top:6px;" onclick="deleteVar(${idx})">Sil</button>`;
            box.appendChild(item);
        });
    }

    function saveVariable() {
        const name = document.getElementById('var-name').value.trim();
        const val = document.getElementById('var-val').value.trim();
        if(!name) return alert("Değişken adı gir!");
        const bot = appData.bots.find(b => b.id == currentBotId);
        bot.variables.push({ name, val });
        localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
        document.getElementById('var-name').value = '';
        document.getElementById('var-val').value = '';
        renderVariables(bot);
        renderMainScreen();
    }

    function deleteVar(idx) {
        const bot = appData.bots.find(b => b.id == currentBotId);
        bot.variables.splice(idx, 1);
        localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
        renderVariables(bot);
        renderMainScreen();
    }

    function updateBotToken() {
        const newToken = document.getElementById('update-token-input').value.trim();
        if(!newToken) return alert("Token boş olamaz!");
        const bot = appData.bots.find(b => b.id == currentBotId);
        bot.token = newToken;
        localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
        alert("✅ Token başarıyla güncellendi!");
    }

    function deleteBot() {
        if(confirm("Bu botu kalıcı olarak silmek istediğine emin misin?")) {
            appData.bots = appData.bots.filter(b => b.id != currentBotId);
            localStorage.setItem('bmj_jubbio_host_db', JSON.stringify(appData));
            exitDetail();
        }
    }
</script>
</body>
</html>
