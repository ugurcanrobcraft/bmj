<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BMJ - Bot Maker Jubbio (75 BDFD Fonksiyon)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #03050b;
            --bg-darkblue: #090e24;
            --bg-card: rgba(18, 26, 56, 0.75);
            --bg-input: rgba(10, 16, 38, 0.85);
            --neon-blue: #2563eb;
            --neon-purple: #8b5cf6;
            --glow-purple: rgba(139, 92, 246, 0.35);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(139, 92, 246, 0.25);
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-black); color: var(--text-main); }
        .app-container { width: 100%; height: 100%; max-width: 440px; margin: 0 auto; background: radial-gradient(circle at top right, #15103a 0%, var(--bg-black) 80%); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .app-header { background: rgba(9, 14, 36, 0.95); backdrop-filter: blur(16px); padding: 14px; text-align: center; border-bottom: 1px solid var(--border-glow); flex-shrink: 0; z-index: 10; }
        .app-header h1 { font-size: 1.1rem; font-weight: 800; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .view-panel { flex: 1; display: none; flex-direction: column; overflow-y: auto; position: relative; padding: 16px; padding-bottom: 70px; }
        .view-panel.active { display: flex; }
        #auth-screen { justify-content: center; padding-bottom: 16px; background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15) 0%, transparent 70%); }
        .auth-card { background: var(--bg-card); backdrop-filter: blur(20px); padding: 24px 18px; border-radius: 20px; border: 1px solid var(--border-glow); }
        .auth-card h2 { text-align: center; font-size: 1.2rem; margin-bottom: 16px; }
        .input-group { margin-bottom: 12px; position: relative; }
        .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }
        .input-box { width: 100%; padding: 12px 12px 12px 40px; background: var(--bg-input); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; outline: none; user-select: text; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: 700; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-purple { background: linear-gradient(135deg, #6366f1, var(--neon-purple)); }
        .btn-blue { background: linear-gradient(135deg, #1d4ed8, var(--neon-blue)); }
        .btn-danger { background: var(--danger); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-sub); }
        .empty-box { margin: auto; text-align: center; color: var(--text-sub); font-size: 1rem; }
        .bot-list { display: flex; flex-direction: column; gap: 10px; }
        .bot-card { background: var(--bg-card); backdrop-filter: blur(12px); border-radius: 14px; padding: 14px; border: 1px solid var(--border-glow); border-left: 4px solid var(--neon-purple); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .fab-btn { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #6366f1, var(--neon-purple)); color: #fff; padding: 12px 20px; border-radius: 30px; font-weight: 700; box-shadow: 0 6px 20px var(--glow-purple); cursor: pointer; z-index: 10; display: flex; align-items: center; gap: 8px; }
        .glass-card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-glow); padding: 14px; border-radius: 14px; margin-bottom: 12px; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; display: flex; background: rgba(9, 14, 36, 0.98); backdrop-filter: blur(16px); border-top: 1px solid var(--border-glow); z-index: 99; }
        .nav-link { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--text-sub); cursor: pointer; opacity: 0.4; }
        .nav-link.active { opacity: 1; color: var(--neon-purple); }
        .modal-bg { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3, 5, 11, 0.92); backdrop-filter: blur(10px); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
        .modal-box { background: var(--bg-darkblue); width: 100%; max-height: 90vh; display: flex; flex-direction: column; padding: 18px; border-radius: 20px; border: 1px solid var(--border-glow); }
        .code-area { width: 100%; height: 110px; background: #04060f; border: 1px solid var(--border-glow); border-radius: 12px; color: #a78bfa; font-family: 'JetBrains Mono', monospace; padding: 10px; outline: none; margin-bottom: 10px; resize: none; user-select: text; font-size: 0.8rem; }
        .func-list-container { flex: 1; overflow-y: auto; background: rgba(4, 6, 15, 0.6); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px; margin-bottom: 10px; }
        .func-item { padding: 6px 8px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; color: #cbd5e1; }
        .func-item:hover { background: rgba(139, 92, 246, 0.15); color: #c084fc; border-radius: 6px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1><i class="fa-solid fa-robot"></i> BMJ - Bot Maker Jubbio</h1>
    </div>

    <!-- GİRİŞ EKRANI -->
    <div id="auth-screen" class="view-panel active">
        <div class="auth-card">
            <h2>Giriş Yap</h2>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="user-input" class="input-box" placeholder="Kullanıcı Adı">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="pass-input" class="input-box" placeholder="Şifre">
            </div>
            <button class="btn btn-purple" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
        </div>
    </div>

    <!-- ANA EKRAN -->
    <div id="main-screen" class="view-panel">
        <div id="bot-list-box" class="bot-list"></div>
        <div class="fab-btn" onclick="openModal('make-modal')"><i class="fa-solid fa-plus"></i> Make Bot</div>
    </div>

    <!-- BOT DETAY -->
    <div id="detail-screen" class="view-panel">
        <div id="tab-home" class="tab-sec">
            <div class="glass-card">
                <p style="font-size:0.75rem; color:var(--text-sub);">Bot İsmi</p>
                <h2 id="bot-name-txt" style="font-size:1.3rem; margin-top:2px;">-</h2>
            </div>
            <button class="btn btn-purple" onclick="deployBotToServer()"><i class="fa-solid fa-bolt"></i> Render'da Botu Çalıştır</button>
            <div class="glass-card" style="margin-top:12px;">
                <h4 style="font-size:0.85rem; margin-bottom:6px; color:var(--text-sub);">75 Fonksiyonlu BDFD Engine</h4>
                <p style="font-size:0.8rem;"><i class="fa-solid fa-check" style="color:var(--success)"></i> &sendMessage, &setVar, &if ve 72 fonksiyon aktif!</p>
            </div>
        </div>

        <div id="tab-codes" class="tab-sec" style="display:none;">
            <button class="btn btn-blue" style="margin-bottom:12px;" onclick="openAddCodeModal()"><i class="fa-solid fa-plus"></i> Yeni Komut Ekle</button>
            <div id="code-list-box"></div>
        </div>

        <div id="tab-settings" class="tab-sec" style="display:none;">
            <button class="btn btn-danger" style="margin-bottom:12px;" onclick="deleteBot()"><i class="fa-solid fa-trash"></i> Botu Sil</button>
            <button class="btn btn-secondary" onclick="exitDetail()"><i class="fa-solid fa-arrow-left"></i> Geri Dön</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-link active" onclick="switchTab('home', this)">🏡</div>
            <div class="nav-link" onclick="switchTab('codes', this)">🖥️</div>
            <div class="nav-link" onclick="switchTab('settings', this)">⚙️</div>
        </div>
    </div>

    <!-- MODAL: MAKE BOT -->
    <div id="make-modal" class="modal-bg">
        <div class="modal-box" style="max-height: auto;">
            <h3 style="margin-bottom:12px; font-size:1.1rem;">Yeni BDFD Bot Oluştur</h3>
            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input type="text" id="make-token" class="input-box" placeholder="Bot Token">
            </div>
            <button class="btn btn-purple" onclick="submitMakeBot()">Oluştur</button>
            <button class="btn btn-secondary" style="margin-top:6px;" onclick="closeModal('make-modal')">İptal</button>
        </div>
    </div>

    <!-- MODAL: KOD VE 75 FONKSİYON LİSTESİ -->
    <div id="code-modal" class="modal-bg">
        <div class="modal-box">
            <h3 style="margin-bottom:8px; font-size:1rem;">(&) BDFD Kod Editörü & Fonksiyonlar</h3>
            <div class="input-group" style="margin-bottom:8px;">
                <i class="fa-solid fa-tag"></i>
                <input type="text" id="code-title" class="input-box" placeholder="Komut Adı (ping.bdfd)">
            </div>
            <textarea id="code-body" class="code-area"></textarea>
            
            <p style="font-size:0.75rem; color:var(--text-sub); margin-bottom:4px;">75 Ana Fonksiyon (Eklemek için tıkla):</p>
            <div class="func-list-container" id="func-list-box"></div>

            <button class="btn btn-purple" onclick="submitSaveCode()">Kaydet</button>
            <button class="btn btn-secondary" style="margin-top:6px;" onclick="closeModal('code-modal')">İptal</button>
        </div>
    </div>
</div>

<script>
    const RENDER_API_URL = window.location.origin;

    // BDFD 75 Ana Fonksiyon Listesi
    const bdfdFunctions = [
        "&sendMessage[metin] - Kanala mesaj gönderir.",
        "&reply[metin] - Mesaja yanıt verir.",
        "&deleteMessage - Mesajı siler.",
        "&react[emoji] - Mesaja emoji tepkisi ekler.",
        "&author[isim;avatar] - Embed yazarını ayarlar.",
        "&title[başlık] - Embed başlığı ekler.",
        "&description[açıklama] - Embed açıklaması ekler.",
        "&color[hex] - Embed rengini ayarlar.",
        "&footer[metin] - Embed alt bilgisi ekler.",
        "&image[url] - Embed görseli ekler.",
        "&thumbnail[url] - Embed küçük resmi ekler.",
        "&addTimestamp - Embed zaman damgası ekler.",
        "&setVar[değişken;değer] - Sunucu değişkeni kaydeder.",
        "&getVar[değişken] - Sunucu değişkenini okur.",
        "&setUserVar[değişken;değer] - Kullanıcı değişkeni kaydeder.",
        "&getUserVar[değişken] - Kullanıcı değişkenini okur.",
        "&addVar[değişken;sayı] - Değişkene sayı ekler.",
        "&subVar[değişken;sayı] - Değişkenden sayı çıkarır.",
        "&if[koşul] - Koşul bloğu başlatır.",
        "&endIf - Koşul bloğunu bitirir.",
        "&authorID - Mesajı yazanın ID'sini verir.",
        "&authorTag - Mesajı yazanın etiketini verir.",
        "&authorName - Mesajı yazanın adını verir.",
        "&channelID - Bulunduğu kanalın ID'sini verir.",
        "&channelName - Kanalın adını verir.",
        "&guildID - Sunucu ID'sini verir.",
        "&guildName - Sunucu adını verir.",
        "&guildMembers - Sunucu üye sayısını verir.",
        "&ban[kullanıcıID] - Kullanıcıyı sunucudan yasaklar.",
        "&kick[kullanıcıID] - Kullanıcıyı sunucudan atar.",
        "&mute[kullanıcıID] - Kullanıcıyı susturur.",
        "&unmute[kullanıcıID] - Kullanıcının susturmasını açar.",
        "&timeout[kullanıcıID;süre] - Kullanıcıya zaman aşımı atar.",
        "&role[kullanıcıID;rolID] - Kullanıcıya rol verir.",
        "&takeRole[kullanıcıID;rolID] - Kullanıcıdan rol alır.",
        "&createRole[isim] - Yeni rol oluşturur.",
        "&deleteRole[rolID] - Rolü siler.",
        "&clear[sayı] - Belirtilen miktarda mesaj siler.",
        "&slowmode[saniye] - Kanala yavaş mod ekler.",
        "&lock - Kanalı yazmaya kapatır.",
        "&unlock - Kanalı yazmaya açar.",
        "&addEmoji[url;isim] - Sunucuya emoji ekler.",
        "&deleteEmoji[emojiID] - Emojiyi siler.",
        "&random[min;max] - Rastgele sayı üretir.",
        "&ping - Botun gecikme süresini gösterir.",
        "&botID - Botun ID'sini verir.",
        "&botName - Botun adını verir.",
        "&uptime - Botun açık kalma süresini verir.",
        "&channelCreate[isim] - Yeni kanal açar.",
        "&channelDelete - Kanalı siler.",
        "&categoryCreate[isim] - Kategori oluşturur.",
        "&giveaway[süre;ödül] - Çekiliş başlatır.",
        "&poll[soru;seçenekler] - Anket oluşturur.",
        "&ticket[kategoriID] - Destek talebi açar.",
        "&closeTicket - Destek talebini kapatır.",
        "&eval[kod] - Kod çalıştırır.",
        "&exec[komut] - Terminal komutu çalıştırır.",
        "&text[metin] - Düz metin çıktısı verir.",
        "&math[işlem] - Matematiksel işlem yapar.",
        "&upper[metin] - Metni büyük harfe çevirir.",
        "&lower[metin] - Metni küçük harfe çevirir.",
        "&length[metin] - Metin uzunluğunu ölçer.",
        "&replace[metin;eski;yeni] - Metinde değiştirme yapar.",
        "&subtext[metin;başlangıç;uzunluk] - Metni böler.",
        "&array[elemanlar] - Dizi oluşturur.",
        "&json[veri] - JSON verisi işler.",
        "&httpGet[url] - API'ye istek atar.",
        "&httpPost[url;veri] - API'ye POST isteği atar.",
        "&channelTopic[konu] - Kanal konusunu değiştirir.",
        "&serverIcon - Sunucu simgesini gösterir.",
        "&serverBanner - Sunucu afişini gösterir.",
        "&boostCount - Sunucu takviye sayısını verir.",
        "&creationDate[kullanıcıID] - Hesap açılış tarihini verir.",
        "&joinedDate[kullanıcıID] - Sunucuya katılım tarihini verir."
    ];

    let appData = JSON.parse(localStorage.getItem('bmj_jubbio_db_v11')) || { bots: [] };
    let currentBotId = null;
    let editingCodeIdx = null;

    function initFuncList() {
        const box = document.getElementById('func-list-box');
        box.innerHTML = '';
        bdfdFunctions.forEach(fn => {
            const div = document.createElement('div');
            div.className = 'func-item';
            div.innerText = fn;
            div.onclick = () => {
                const textarea = document.getElementById('code-body');
                const funcName = fn.split(' - ')[0];
                textarea.value += "\n" + funcName;
            };
            box.appendChild(div);
        });
    }

    function login() {
        if(!document.getElementById('user-input').value || !document.getElementById('pass-input').value) return alert("Bilgileri doldur!");
        document.getElementById('auth-screen').classList.remove('active');
        document.getElementById('main-screen').classList.add('active');
        renderMainScreen();
    }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; if(id === 'code-modal') initFuncList(); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function renderMainScreen() {
        const box = document.getElementById('bot-list-box');
        box.innerHTML = appData.bots.length === 0 ? `<div class="empty-box">Kayıtlı Botun Yok!</div>` : '';
        appData.bots.forEach(bot => {
            const card = document.createElement('div');
            card.className = 'bot-card';
            card.onclick = () => openBotDetail(bot.id);
            card.innerHTML = `<div><h4>${bot.name}</h4><p style="font-size:0.75rem; color:var(--text-sub);">Komut: ${bot.codes.length}</p></div><i class="fa-solid fa-chevron-right" style="color:var(--text-sub)"></i>`;
            box.appendChild(card);
        });
    }

    function submitMakeBot() {
        const token = document.getElementById('make-token').value.trim();
        if (!token) return alert("Token gir!");
        appData.bots.push({ id: Date.now(), name: "BMJ_Bot_" + Math.floor(Math.random()*1000), token, codes: [{ name: 'ping.bdfd', content: '&trigger[messageCreate]\n&sendMessage[Pong!]' }] });
        localStorage.setItem('bmj_jubbio_db_v11', JSON.stringify(appData));
        closeModal('make-modal');
        renderMainScreen();
    }

    function openBotDetail(id) {
        currentBotId = id;
        const bot = appData.bots.find(b => b.id == id);
        document.getElementById('bot-name-txt').innerText = bot.name;
        document.getElementById('main-screen').classList.remove('active');
        document.getElementById('detail-screen').classList.add('active');
        switchTab('home', document.querySelectorAll('.nav-link')[0]);
        renderCodes(bot);
    }

    function exitDetail() {
        currentBotId = null;
        document.getElementById('detail-screen').classList.remove('active');
        document.getElementById('main-screen').classList.add('active');
        renderMainScreen();
    }

    function switchTab(k, el) {
        document.querySelectorAll('.tab-sec').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + k).style.display = 'block';
        if(el) el.classList.add('active');
    }

    async function deployBotToServer() {
        const bot = appData.bots.find(b => b.id == currentBotId);
        try {
            const res = await fetch(`${RENDER_API_URL}/api/run-bot`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ botId: bot.id, token: bot.token, codes: bot.codes })
            });
            const data = await res.json();
            alert(data.message || "Bot Render sunucusunda tetiklendi!");
        } catch(err) {
            alert("Render bağlantı hatası!");
        }
    }

    function renderCodes(bot) {
        const box = document.getElementById('code-list-box');
        box.innerHTML = '';
        bot.codes.forEach((c, i) => {
            const item = document.createElement('div');
            item.className = 'glass-card';
            item.style.cursor = 'pointer';
            item.onclick = () => { editingCodeIdx = i; document.getElementById('code-title').value = c.name; document.getElementById('code-body').value = c.content; openModal('code-modal'); };
            item.innerHTML = `<strong>${c.name}</strong>`;
            box.appendChild(item);
        });
    }

    function openAddCodeModal() {
        editingCodeIdx = null;
        document.getElementById('code-title').value = '';
        document.getElementById('code-body').value = '&trigger[messageCreate]\n&sendMessage[Test]';
        openModal('code-modal');
    }

    function submitSaveCode() {
        const title = document.getElementById('code-title').value.trim();
        const content = document.getElementById('code-body').value;
        const bot = appData.bots.find(b => b.id == currentBotId);
        if(editingCodeIdx !== null) bot.codes[editingCodeIdx] = { name: title, content };
        else bot.codes.push({ name: title, content });
        localStorage.setItem('bmj_jubbio_db_v11', JSON.stringify(appData));
        closeModal('code-modal');
        renderCodes(bot);
    }

    function deleteBot() {
        if(confirm("Silinsin mi?")) {
            appData.bots = appData.bots.filter(b => b.id != currentBotId);
            localStorage.setItem('bmj_jubbio_db_v11', JSON.stringify(appData));
            exitDetail();
        }
    }
</script>
</body>
</html>
