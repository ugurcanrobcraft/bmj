<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bot Maker Jubio</title>
<style>
:root{--bg:#080b12;--card:#111827;--card2:#172033;--line:#263247;--text:#f8fafc;--muted:#94a3b8;--blue:#22d3ee;--purple:#8b5cf6;--green:#10b981;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#151c32 0,#080b12 48%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:rgba(8,11,18,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;font-weight:800}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-size:22px}
.brand small{display:block;color:var(--muted);font-size:10px}.screen{padding:18px}.hidden{display:none!important}
.card{background:linear-gradient(145deg,var(--card),#0e1524);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px #0004}
h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.hero{text-align:center;padding:26px 18px}.hero h1{font-size:28px;margin-bottom:7px}.hero b{color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{text-align:center}.stat strong{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}
input,textarea{width:100%;background:#080d17;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;outline:none;margin:7px 0 11px}textarea{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,monospace}input:focus,textarea:focus{border-color:var(--blue)}
.btn{padding:11px 15px;border-radius:11px;color:white;font-weight:700}.primary{background:linear-gradient(135deg,#0891b2,#6366f1)}.green{background:#059669}.red{background:#dc2626}.ghost{background:#202b3d}.full{width:100%}
.bot{display:flex;align-items:center;justify-content:space-between;gap:12px}.botname{font-weight:800}.status{font-size:12px;margin-top:4px}.online{color:var(--green)}.offline{color:var(--red)}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.timer{text-align:center;font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;margin:12px 0;color:var(--blue)}
.command{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0c1320;border:1px solid var(--line);padding:13px;border-radius:12px;margin:8px 0}.cmd{font-family:monospace;font-weight:800}.code-preview{color:var(--muted);font-size:11px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;height:65px;background:rgba(14,20,32,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}nav button{flex:1;max-width:180px;background:none;color:var(--muted);font-size:11px}nav button.active{color:var(--blue)}nav span{display:block;font-size:21px;margin-bottom:2px}
.fab{position:fixed;right:20px;bottom:85px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;font-size:28px;box-shadow:0 8px 25px #0008;z-index:15}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:none;place-items:center;padding:18px;z-index:50}.modal.show{display:grid}.modalbox{width:100%;max-width:500px;background:#111827;border:1px solid var(--line);border-radius:18px;padding:20px;max-height:90vh;overflow:auto}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-120px);transition:.25s;z-index:100;background:#111827;border:1px solid var(--line);padding:12px 18px;border-radius:999px;box-shadow:0 10px 30px #0008}.toast.show{transform:translate(-50%,0)}.toast.err{border-color:#7f1d1d}
.guide{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.guide code{color:var(--blue)}.notice{font-size:12px;color:#fbbf24;background:#241d08;border:1px solid #6b4f12;padding:12px;border-radius:12px}
@media(max-width:520px){.screen{padding:13px}.grid{grid-template-columns:1fr 1fr}.bot{align-items:flex-start;flex-direction:column}.actions{width:100%;justify-content:flex-start}.timer{font-size:35px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="app">
<header>
  <div class="brand"><div class="logo">🤖</div><div>Bot Maker Jubio<small>BMJ • Bot geliştirme paneli</small></div></div>
  <button class="btn ghost" onclick="showBots()">🤖 Botlar</button>
</header>

<main id="screen"></main>

<nav id="nav" class="hidden">
  <button data-tab="dashboard" onclick="tab('dashboard')"><span>⌂</span>Ana Sayfa</button>
  <button data-tab="commands" onclick="tab('commands')"><span>⌘</span>Komutlar</button>
  <button data-tab="guide" onclick="tab('guide')"><span>?</span>Rehber</button>
  <button onclick="showBots()"><span>↩</span>Botlar</button>
</nav>
</div>

<div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div>

<script>
const API = location.origin;
const KEY='bmj_v2';
let data=JSON.parse(localStorage.getItem(KEY)||'{"bots":[]}');
let active=null, currentTab='dashboard', poll=null;

const guides=[
['$noMentionMessage','Mesajın temiz metnini kullanır.'],
['$username','Komutu kullanan kişinin kullanıcı adını verir.'],
['$nickname','Komutu kullanan kişinin takma adını verir.'],
['$channelID','Komutun kullanıldığı kanal ID.'],
['$channelName','Komutun kullanıldığı kanal adı.'],
['$sum[1;2;3]','Sayıları toplar.'],
['$sub[10;3]','İlk sayıdan ikinci sayıyı çıkarır.'],
['$multi[4;5]','İki sayıyı çarpar.'],
['$divide[20;4]','İlk sayıyı ikinci sayıya böler.'],
['$description[Metin]','Embed açıklaması oluşturur.'],
['$title[Başlık]','Embed başlığı oluşturur.'],
['$footer[Alt bilgi]','Embed alt bilgisini oluşturur.'],
['$author[Yazar]','Embed yazar alanını oluşturur.'],
['$image[URL]','Embed içine resim URL’si ekler.']
];

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function id(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}
function bot(){return data.bots.find(x=>x.id===active)}
function toast(t,e=false){let x=document.getElementById('toast');x.textContent=t;x.className='toast show'+(e?' err':'');setTimeout(()=>x.className='toast',2400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showBots(){
  active=null;clearInterval(poll);document.getElementById('nav').classList.add('hidden');
  document.getElementById('screen').innerHTML=`<section class="screen"><div class="hero card"><h1>🤖 <b>Bot Maker Jubio</b></h1><p class="muted">Jubbio botlarını tek panelden yönet.</p><button class="btn primary" onclick="newBot()">＋ Yeni Bot</button></div><div id="bots"></div></section>`;
  renderBots();
}
function renderBots(){
  let c=document.getElementById('bots');if(!c)return;
  if(!data.bots.length){c.innerHTML='<div class="card" style="text-align:center"><p class="muted">Henüz bot eklenmedi.</p></div>';return}
  c.innerHTML=data.bots.map(b=>`<div class="card bot"><div><div class="botname">🤖 ${esc(b.name)}</div><div class="status" id="st-${b.id}">Durum kontrol ediliyor…</div><div class="muted">${b.commands.length} komut</div></div><div class="actions"><button class="btn primary" onclick="openBot('${b.id}')">Aç</button><button class="btn ghost" onclick="editBot('${b.id}')">⚙</button><button class="btn red" onclick="deleteBot('${b.id}')">Sil</button></div></div>`).join('');
  data.bots.forEach(refreshStatus);
}
async function refreshStatus(b){
 try{let r=await fetch(API+'/api/bots/status/'+encodeURIComponent(b.id));let j=await r.json();let e=document.getElementById('st-'+b.id);if(e)e.innerHTML=j.online?'<span class="online">● Online</span>':'<span class="offline">● Offline</span>'}
 catch{let e=document.getElementById('st-'+b.id);if(e)e.innerHTML='<span class="offline">● Host bağlantısı yok</span>'}
}
function newBot(){
 modal(`<h2>Yeni Bot</h2><input id="bn" placeholder="Bot adı"><input id="bt" type="password" placeholder="Bot tokeni"><div class="notice">Token tarayıcı localStorage'a kaydedilmez. Host başlatılırken sunucuya gönderilir.</div><div class="row" style="margin-top:14px"><button class="btn ghost full" onclick="closeModal()">İptal</button><button class="btn primary full" onclick="createBot()">Oluştur</button></div>`);
}
function createBot(){
 let name=document.getElementById('bn').value.trim(),token=document.getElementById('bt').value.trim();
 if(!name||!token)return toast('İsim ve token gerekli',true);
 data.bots.push({id:id(),name,commands:[]});save();closeModal();toast('Bot eklendi');renderBots();
 // Token yalnızca bu oturum için açılışta gönderilir.
 window.__tokens=window.__tokens||{};window.__tokens[data.bots.at(-1).id]=token;
}
function editBot(bid){
 let b=data.bots.find(x=>x.id===bid);
 modal(`<h2>Botu Düzenle</h2><input id="en" value="${esc(b.name)}"><input id="et" type="password" placeholder="Yeni token (boş bırak = mevcut host tokenini kullan)"><div class="row"><button class="btn ghost full" onclick="closeModal()">İptal</button><button class="btn primary full" onclick="saveBotEdit('${bid}')">Kaydet</button></div>`);
}
function saveBotEdit(bid){
 let b=data.bots.find(x=>x.id===bid),n=document.getElementById('en').value.trim(),t=document.getElementById('et').value.trim();
 if(!n)return toast('Bot adı gerekli',true);b.name=n;if(t){window.__tokens=window.__tokens||{};window.__tokens[bid]=t}save();closeModal();renderBots();toast('Güncellendi');
}
async function deleteBot(bid){
 if(!confirm('Bot silinsin ve host durdurulsun mu?'))return;
 try{await fetch(API+'/api/bots/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botId:bid})})}catch{}
 data.bots=data.bots.filter(x=>x.id!==bid);save();toast('Bot silindi');renderBots();
}
function openBot(bid){
 active=bid;currentTab='dashboard';document.getElementById('nav').classList.remove('hidden');renderPanel();startPoll();
}
function renderPanel(){
 let b=bot();if(!b)return showBots();
 document.getElementById('screen').innerHTML=`<section class="screen">
 <div class="card"><div class="row between"><div><h2>${esc(b.name)}</h2><p id="onlineText" class="muted">Durum kontrol ediliyor…</p></div><button class="btn red" onclick="stopHost()">Durdur</button></div></div>
 <div id="panel"></div></section>`;
 tab(currentTab);
}
async function getStatus(){
 try{let r=await fetch(API+'/api/bots/status/'+encodeURIComponent(active));return await r.json()}catch{return {online:false,remaining:0,ready:false}}
}
function startPoll(){clearInterval(poll);poll=setInterval(updatePanelStatus,1000);updatePanelStatus()}
async function updatePanelStatus(){
 if(!active)return;let s=await getStatus(),t=document.getElementById('onlineText');if(t)t.innerHTML=s.online?'<span class="online">● Online</span>':'<span class="offline">● Offline</span>';
 let timer=document.getElementById('timer');if(timer)timer.textContent=fmt(s.remaining||0);
}
function fmt(ms){let x=Math.max(0,Math.floor(ms/1000)),h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}
function tab(t){
 currentTab=t;document.querySelectorAll('nav button[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
 let p=document.getElementById('panel');if(!p)return;
 if(t==='dashboard'){
  p.innerHTML=`<div class="card" style="text-align:center"><div class="muted">Host süresi</div><div id="timer" class="timer">00:00:00</div><button class="btn primary full" onclick="startHost()">▶ +90 Dakika Host</button><p class="muted" style="font-size:12px;margin:12px 0 0">Host süresi sunucuda tutulur. Sayfayı kapatsan da bot çalışmaya devam eder.</p></div><div class="grid"><div class="card stat"><strong>${bot().commands.length}</strong><span>Komut</span></div><div class="card stat"><strong>@jubbio/core</strong><span>Altyapı</span></div></div>`;
 }else if(t==='commands') renderCommands(p);else renderGuide(p);updatePanelStatus();
}
function renderCommands(p){
 let b=bot();p.innerHTML=`<div class="card"><h2>Komutlar</h2><p class="muted">Örn: <code>!ping</code> → <code>$description[Pong!]</code></p></div>`+
 (b.commands.length?b.commands.map(c=>`<div class="command"><div><div class="cmd">${esc(c.trigger)}</div><div class="code-preview">${esc(c.code)}</div></div><div class="actions"><button class="btn ghost" onclick="editCommand('${c.id}')">Düzenle</button><button class="btn red" onclick="deleteCommand('${c.id}')">Sil</button></div></div>`).join(''):'<div class="card muted">Henüz komut yok.</div>')+
 `<button class="btn primary full" onclick="newCommand()">＋ Komut Oluştur</button>`;
}
function newCommand(){modal(`<h2>Komut Oluştur</h2><input id="ct" placeholder="Tetikleyici örn. !ping"><textarea id="cc" placeholder="$description[Pong!]\n$footer[Bot Maker Jubio]"></textarea><div class="row"><button class="btn ghost full" onclick="closeModal()">İptal</button><button class="btn primary full" onclick="saveCommand()">Kaydet</button></div>`)}
function editCommand(cid){let c=bot().commands.find(x=>x.id===cid);modal(`<h2>Komutu Düzenle</h2><input id="ct" value="${esc(c.trigger)}"><textarea id="cc">${esc(c.code)}</textarea><div class="row"><button class="btn ghost full" onclick="closeModal()">İptal</button><button class="btn primary full" onclick="saveCommand('${cid}')">Kaydet</button></div>`)}
function saveCommand(cid){
 let tr=document.getElementById('ct').value.trim(),co=document.getElementById('cc').value.trim();if(!tr||!co)return toast('Tetikleyici ve kod gerekli',true);
 if(cid){let c=bot().commands.find(x=>x.id===cid);c.trigger=tr;c.code=co}else bot().commands.push({id:id(),trigger:tr,code:co});save();closeModal();renderCommands(document.getElementById('panel'));toast('Komut kaydedildi');
}
function deleteCommand(cid){if(!confirm('Komut silinsin mi?'))return;bot().commands=bot().commands.filter(x=>x.id!==cid);save();renderCommands(document.getElementById('panel'));toast('Komut silindi')}
function renderGuide(p){p.innerHTML='<div class="card"><h2>BMJ Rehberi</h2><p class="muted">Sunucu tarafındaki komut yorumlayıcı bu temel fonksiyonları destekler.</p></div>'+guides.map(x=>`<div class="guide"><code>${esc(x[0])}</code><div class="muted" style="margin-top:5px;font-size:13px">${esc(x[1])}</div></div>`).join('')}
async function startHost(){
 let b=bot();window.__tokens=window.__tokens||{};let token=window.__tokens[b.id]||'';
 if(!token){modal(`<h2>Host Başlat</h2><p class="muted">Bu bot için token sunucuda kayıtlı değil. Tokeni gir:</p><input id="ht" type="password" placeholder="Bot tokeni"><div class="row"><button class="btn ghost full" onclick="closeModal()">İptal</button><button class="btn primary full" onclick="doStartHost()">Başlat</button></div>`);return}
 await doStartHost(token);
}
async function doStartHost(token){
 let b=bot(),t=token||document.getElementById('ht').value.trim();if(!t)return toast('Token gerekli',true);
 window.__tokens=window.__tokens||{};window.__tokens[b.id]=t;
 try{let r=await fetch(API+'/api/bots/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botId:b.id,token:t,commands:b.commands,minutes:90})});let j=await r.json();if(!r.ok)throw new Error(j.error||'Host başlatılamadı');closeModal();toast('Host başlatıldı');updatePanelStatus()}catch(e){toast(e.message,true)}
}
async function stopHost(){
 try{let r=await fetch(API+'/api/bots/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botId:active})});let j=await r.json();if(!r.ok)throw new Error(j.error);toast('Host durduruldu');updatePanelStatus()}catch(e){toast(e.message,true)}
}
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
showBots();
</script>
</body>
</html>
