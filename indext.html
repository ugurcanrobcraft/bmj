<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Apple Basket</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 2px #fff;
            pointer-events: none;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #FFD700;
        }
        p {
            font-size: 20px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">Skor: <span id="score">0</span></div>

    <!-- Başlangıç Ekranı -->
    <div id="start-screen" class="screen">
        <h1>Apple Basket</h1>
        <p>Elmaları Sepetle Yakala!</p>
        <button onclick="startGame()">OYUNA BAŞLA</button>
    </div>

    <!-- Game Over Ekranı -->
    <div id="game-over-screen" class="screen hidden">
        <h1>OYUN BİTTİ</h1>
        <p id="fail-reason">Elmayı Kaçırdın!</p>
        <p>Toplam Skor: <span id="final-score">0</span></p>
        <button onclick="restartGame()">TEKRAR OYNA</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let isPlaying = false;
    let gameLoop;
    
    // Sepet ve Elma Nesneleri
    let basket = { x: 0, y: 0, width: 100, height: 20, speed: 8 };
    let apple = { x: 0, y: 0, radius: 15, speed: 5 };

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        basket.y = canvas.height - 60;
        basket.width = Math.min(canvas.width * 0.25, 120);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Dokunmatik / Fare Kontrolleri
    function moveBasket(e) {
        if (!isPlaying) return;
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        basket.x = clientX - basket.width / 2;
        if (basket.x < 0) basket.x = 0;
        if (basket.x + basket.width > canvas.width) basket.x = canvas.width - basket.width;
    }
    canvas.addEventListener('mousemove', moveBasket);
    canvas.addEventListener('touchmove', moveBasket);

    function resetApple() {
        apple.x = Math.random() * (canvas.width - apple.radius * 2) + apple.radius;
        apple.y = -apple.radius;
        apple.speed = 4 + Math.random() * 3 + (score * 0.2); // Skor arttıkça hızlanır
    }

    function startGame() {
        score = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        
        basket.x = canvas.width / 2 - basket.width / 2;
        resetApple();
        isPlaying = true;
        
        cancelAnimationFrame(gameLoop);
        update();
    }

    function restartGame() {
        startGame();
    }

    // --- REKLAM TETİKLEME FONKSİYONU ---
    function triggerAdMobInterstitial() {
        console.log("Reklam çağırma isteği gönderildi.");

        // 1. Standart AndroidAPI (Örn: Native WebView / Android Studio Köprüleri)
        if (typeof AndroidAPI !== 'undefined' && typeof AndroidAPI.showInterstitialAd === 'function') {
            AndroidAPI.showInterstitialAd();
        }
        // 2. WebIntoApp Altyapısı
        else if (typeof WebIntoApp !== 'undefined' && typeof WebIntoApp.showAd === 'function') {
            WebIntoApp.showAd();
        }
        // 3. Website2APK / Diğer Standart Arayüzler
        else if (typeof Android !== 'undefined' && typeof Android.showInterstitial === 'function') {
            Android.showInterstitial();
        }
        else {
            console.log("Tarayıcı modundasınız, APK içerisinde reklam otomatik gösterilecektir.");
        }
    }

    function gameOver(reason) {
        isPlaying = false;
        cancelAnimationFrame(gameLoop);

        document.getElementById('fail-reason').innerText = reason;
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over-screen').classList.remove('hidden');

        // Yandığı an AdMob reklamını tetikle
        triggerAdMobInterstitial();
    }

    function update() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Elmayı Düşür
        apple.y += apple.speed;

        // Çarpışma Kontrolü (Sepet Elmayı Yakaladı mı?)
        if (
            apple.y + apple.radius >= basket.y &&
            apple.x >= basket.x &&
            apple.x <= basket.x + basket.width
        ) {
            score += 10;
            document.getElementById('score').innerText = score;
            resetApple();
        }

        // Elma Yere Düştü mü? (Oyun Bitti)
        if (apple.y - apple.radius > canvas.height) {
            gameOver("Elmayı Kaçırdın!");
            return;
        }

        // Çizimler
        // 1. Sepet
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

        // 2. Elma
        ctx.beginPath();
        ctx.arc(apple.x, apple.y, apple.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#FF0000';
        ctx.fill();
        ctx.closePath();

        gameLoop = requestAnimationFrame(update);
    }
</script>
</body>
</html>
